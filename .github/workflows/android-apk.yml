name: Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Optional repo secret. Without it the app ships with sample data.
      EXPO_PUBLIC_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      EXPO_PUBLIC_TMDB_REGION: ${{ vars.TMDB_REGION || 'US' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk reel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reel-android-apk
          path: mobile/reel.apk

      - name: Publish to the "android-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Reel for Android (latest build)" \
              --notes "Download reel.apk on your Android phone and open it to install. You may need to allow installs from your browser." \
              --target "${GITHUB_SHA}"
          gh release upload android-latest reel.apk --clobber
